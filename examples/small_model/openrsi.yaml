# 小模型跑通全流程：Qwen2.5-0.5B-Instruct 做 GSM8K，同时进化系统提示和模型权重。
# 需要 1 张 GPU（24GB 足够）、vllm、torch、transformers，以及 verl 预处理好的 GSM8K：
#   python <verl>/examples/data_preprocess/gsm8k.py --local_dir ~/data/gsm8k
#   openrsi run examples/small_model/openrsi.yaml
#
# 每一代由 Shinka 的 UCB 在两个提案器里选一个：
#   prompt   读错题、改写系统提示（PromptRewriter）。0.5B 自己改写效果很差（会把题目抄进提示），
#            建议把它的 base_url / model 指向更强的模型；被进化的仍然是小模型
#   weights  把判别器判为通过的 train 轨迹拿去 SFT（DistillProposer + train_sft.py），拒绝采样式自我蒸馏
# 权重变了，ChatAgent 会用新 checkpoint 重启 vLLM。
# 起点的系统提示已经要求按 "#### 数字" 作答（initial），否则一开始没有答对的轨迹，权重进化无从开始。
protocol: openrsi/0.4
name: small-model-gsm8k
plugins: [gsm8k_env]

components:
  env:      {python: "gsm8k_env:GSM8KEnv", with: {data_dir: ~/data/gsm8k, train_per_round: 64, holdout: 200, final: 300}}
  agent:
    python: "openrsi_llm:ChatAgent"
    with:
      model: policy
      max_tokens: 512
      server:
        port: 8100
        log_dir: .openrsi/vllm-logs
        command: [python, -m, vllm.entrypoints.openai.api_server, --model, "{model}", --served-model-name, policy,
                  --port, "{port}", --gpu-memory-utilization, "0.3", --max-model-len, "2048"]
  judge:
    python: "openrsi_judge:EvidenceJudge"
    with:
      rubric:
        items:
          - {id: correct, check: output_equals, required: true, params: {extract: "#### (\\-?[0-9\\.\\,]+)"}}
  evidence: {same_as: judge}
  proposer:
    python: "openrsi_proposer:CompositeProposer"
    with:
      proposers:
        - {name: prompt, python: "openrsi_llm:PromptRewriter", with: {base_url: "http://127.0.0.1:8100/v1", model: policy}}
        - {name: weights, python: "openrsi_verl:DistillProposer", with: {data_dir: .openrsi/sft, min_examples: 16}}
  algorithm: {python: "openrsi_algorithm:ShinkaAlgorithm", with: {proposers: [prompt, weights], max_generations: 8, patience: 4}}
  gate:     {python: "openrsi_gate:HoldoutGate", with: {significance_z: 1.0}}
  guard:    {python: "openrsi_guard:PolicyGuard"}
  lineage:  {python: "openrsi_lineage:LineageStore", with: {path: .openrsi/lineage.jsonl}}

evolvables:
  prompt:
    python: "openrsi_evolvables:PromptEvolvable"
    with:
      path: .openrsi/prompt
      initial:
        - {id: instructions, text: "Solve the math problem step by step. On the last line, write the final answer as '#### <number>'."}
  weights:
    python: "openrsi_verl:WeightsEvolvable"
    with:
      base_model: Qwen/Qwen2.5-0.5B-Instruct
      path: .openrsi/weights
      trainer: [python, train_sft.py, --model, "{base_model}", --data, "{data}", --output, "{output_dir}",
                --epochs, "2", --lr, "1e-5"]

loop:
  max_patches: 1
