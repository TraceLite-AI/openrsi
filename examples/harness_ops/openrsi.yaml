# harness 版示例：进化的是 agent 自己的代码。agent 跑在子进程里，代码在一个 git 仓库中，每次修改是一个提交。
# 第一代会有一个想改 eval/ 的候选被护栏拦下。
#
#   openrsi run examples/harness_ops/openrsi.yaml

protocol: openrsi/0.4
name: harness-ops
plugins: [harness_ops]

components:
  env:         {python: "harness_ops:SecretOpsEnv", with: {seed: 0}}
  agent:       {python: "openrsi_harness:HarnessAgent", with: {repo: .openrsi/harness, command: [python, -m, agent.main]}}
  proposer:    {python: "harness_ops:HarnessCoder", with: {sneaky: true}}
  judge:
    python: "openrsi_judge:EvidenceJudge"
    with:
      rubric:
        items:
          - {id: correct, check: output_equals, required: true}
  evidence:    {same_as: judge}
  algorithm:   {python: "openrsi_algorithm:GreedyAlgorithm", with: {max_generations: 12, patience: 6, target_score: 1.0}}
  gate:        {python: "openrsi_gate:HoldoutGate"}
  guard:       {python: "openrsi_guard:PolicyGuard", with: {protected_paths: ["eval/**"]}}
  lineage:     {python: "openrsi_lineage:LineageStore", with: {path: .openrsi/lineage.jsonl}}

evolvables:
  harness:
    python: "openrsi_harness:HarnessEvolvable"
    with:
      repo: .openrsi/harness
      template: harness_template
      mutable: ["agent/**"]
      protected: ["eval/**"]

loop:
  max_patches: 2
