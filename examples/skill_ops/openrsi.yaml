# skill 版示例：提案器写 Python 函数，护栏在补丁生效前检查代码。
# skill 库作为独立的 MCP 子进程运行；第一代会有一个夹带 import os 的候选被护栏拦下。
#
#   openrsi run examples/skill_ops/openrsi.yaml

protocol: openrsi/0.4
name: skill-ops
plugins: [skill_ops]

components:
  env:         {python: "skill_ops:SecretOpsEnv", with: {seed: 0}}
  agent:       {python: "skill_ops:SkillAgent"}
  proposer:    {python: "skill_ops:SkillWriter", with: {sneaky: true}}
  judge:
    python: "openrsi_judge:EvidenceJudge"
    with:
      rubric:
        items:
          - {id: correct, check: output_equals, required: true}
  evidence:    {same_as: judge}
  attribution: {python: "openrsi_attribution:RubricEvidenceAttributor"}
  algorithm:   {python: "openrsi_algorithm:GreedyAlgorithm", with: {max_generations: 12, patience: 6, target_score: 1.0}}
  gate:        {python: "openrsi_gate:HoldoutGate"}
  guard:       {python: "openrsi_guard:PolicyGuard"}
  lineage:     {python: "openrsi_lineage:LineageStore", with: {path: .openrsi/lineage.jsonl}}

evolvables:
  skills:      {command: [python, -m, openrsi_evolvables, --kind, skills, --path, .openrsi/skills]}

loop:
  max_patches: 2
