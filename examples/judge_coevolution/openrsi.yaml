# 判别器和 agent 轮流进化：先识破作弊，再学会走正路。
#
#   openrsi run examples/judge_coevolution/openrsi.yaml
#
# anchor.jsonl 是人工标注集，由 `python coevo.py` 生成。

protocol: openrsi/0.3
name: judge-coevolution
plugins: [coevo]

components:
  env:         {python: "coevo:BugfixEnv"}
  agent:       {python: "coevo:ShortcutCoder"}
  judge:
    python: "openrsi_judge:EvolvingJudge"
    with:
      protect: ["tests/**"]
      path: .openrsi/rubric
      rubric:                      # 起点：只看 agent 有没有说 done
        items:
          - {id: says_done, check: output_matches, params: {pattern: done}, required: true}
  evidence:    {same_as: judge}
  memory:      {python: "openrsi_memory:MemoryEvolvable", with: {path: .openrsi/memory}}
  attribution: {python: "openrsi_attribution:RubricEvidenceAttributor"}
  proposer:    {python: "openrsi_proposer:CompositeProposer", with: {proposers: [lesson, rubric-auditor]}}
  algorithm:   {python: "openrsi_algorithm:GreedyAlgorithm", with: {metric: progress, max_generations: 8, patience: 4, target_score: 3.0}}
  gate:        {python: "openrsi_gate:HoldoutGate"}
  lineage:     {python: "openrsi_lineage:LineageStore", with: {path: .openrsi/lineage.jsonl}}

evolvables:
  rubric:      {same_as: judge}    # 判别器本身也是可进化体

loop:
  anchor: anchor.jsonl
  judge_every: 2                   # 偶数代改判别器，奇数代改 agent 侧
  metric: progress
