[project]
name = "openrsi-langgraph"
version = "0.3.0"
description = "Turn LangGraph message state into OpenRSI trajectories and judge them"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.3,<0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_langgraph"]
