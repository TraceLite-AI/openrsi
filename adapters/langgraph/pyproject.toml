[project]
name = "anyrsi-langgraph"
version = "0.4.0"
description = "Turn LangGraph message state into AnyRSI trajectories and judge them"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_langgraph"]
