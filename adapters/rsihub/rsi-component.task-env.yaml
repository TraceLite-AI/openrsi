protocol: anyrsi/0.4
name: anyrsi/rsihub-task-env
version: 0.4.3
description: RSIHub 的题库（Harbor 数据集）当环境。按 RSIHub splits._assign 的规则划分 train / gate / sealed，映射成 train / holdout / final；题目带内容哈希。
kinds: [env]
implements:
  - rsi_component_info
  - rsi_env_tasks
capabilities: {harbor_dataset: true, rsihub_split: true}
runtime:
  transport: stdio
  command: [anyrsi-serve, "anyrsi_rsihub:RSIHubTaskEnv", --with, '{"dataset": "/path/to/harbor/dataset"}']
