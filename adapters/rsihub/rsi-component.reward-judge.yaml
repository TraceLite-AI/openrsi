protocol: openrsi/0.4
name: openrsi/harbor-reward-judge
version: 0.4.2
description: 按 Harbor 验证脚本的奖励打分。自己重新读 result.json、核对哈希和题名，不信 agent 转述的分数；没有奖励判失败。
kinds: [judge]
implements:
  - rsi_component_info
  - rsi_judge_evaluate
  - rsi_judge_calibrate
capabilities: {harbor: true}
runtime:
  transport: stdio
  command: [openrsi-serve, "openrsi_rsihub:HarborRewardJudge"]
