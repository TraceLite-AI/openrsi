[project]
name = "anyrsi-rsihub"
version = "0.4.3"
description = "AnyRSI components as RSIHub operators, and RSIHub task banks (Harbor) as an AnyRSI environment"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5", "anyrsi-gate>=0.4,<0.5", "anyrsi-guard>=0.4,<0.5"]

[project.optional-dependencies]
lineage = ["anyrsi-lineage>=0.4,<0.5"]
server = ["anyrsi-llm>=0.4,<0.5"]

[project.scripts]
anyrsi-rsihub = "anyrsi_rsihub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_rsihub"]
