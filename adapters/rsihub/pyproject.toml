[project]
name = "openrsi-rsihub"
version = "0.4.1"
description = "OpenRSI components as RSIHub operators (guard validate, no-regression gate, Shinka select)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5", "openrsi-gate>=0.4,<0.5", "openrsi-guard>=0.4,<0.5"]

[project.optional-dependencies]
lineage = ["openrsi-lineage>=0.4,<0.5"]

[project.scripts]
openrsi-rsihub = "openrsi_rsihub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_rsihub"]
