[project]
name = "openrsi-dspy"
version = "0.3.0"
description = "Use OpenRSI judges as DSPy metrics (including GEPA feedback)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.3,<0.4"]

[project.optional-dependencies]
dspy = ["dspy>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_dspy"]
