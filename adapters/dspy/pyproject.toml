[project]
name = "anyrsi-dspy"
version = "0.4.0"
description = "Use AnyRSI judges as DSPy metrics (including GEPA feedback)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.optional-dependencies]
dspy = ["dspy>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_dspy"]
