[project]
name = "openrsi-verl"
version = "0.4.0"
description = "OpenRSI x verl: judges as reward functions, judge-verified training data, model weights as an evolvable"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5", "pyyaml>=6"]

[project.optional-dependencies]
parquet = ["pandas>=2", "pyarrow>=14"]

[project.scripts]
openrsi-verl = "openrsi_verl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_verl"]
