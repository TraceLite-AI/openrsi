[project]
name = "anyrsi-verl"
version = "0.4.1"
description = "AnyRSI x verl: judges as reward functions, judge-verified training data, model weights as an evolvable"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5", "anyrsi-weights>=0.4.1,<0.5", "pyyaml>=6"]

[project.optional-dependencies]
parquet = ["pandas>=2", "pyarrow>=14"]

[project.scripts]
anyrsi-verl = "anyrsi_verl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_verl"]
