[project]
name = "openrsi-runtime"
version = "0.4.3"
description = "Reference runtime that wires OpenRSI components (local or MCP) into a self-improvement loop"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5"]

[project.scripts]
openrsi = "openrsi_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_runtime"]
