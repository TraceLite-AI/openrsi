[project]
name = "anyrsi-runtime"
version = "0.4.5"
description = "Reference runtime that wires AnyRSI components (local or MCP) into a self-improvement loop"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.scripts]
anyrsi = "anyrsi_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_runtime"]
