protocol: anyrsi/0.4
name: anyrsi/patch-proposer
version: 0.4.5
description: 用 LLM 回答"改进这个 agent"的题（和 loop.self_propose 同一道题，但由独立的 LLM 以普通助手身份回答），产出可以有多条操作的 JSON 补丁，适合配合 loop.group.atomize 拆开测。
kinds: [proposer]
implements:
  - rsi_component_info
  - rsi_proposer_propose
capabilities: {openai_compatible: true}
runtime:
  transport: stdio
  command: [anyrsi-serve, "anyrsi_llm:PatchProposer", --with, '{"base_url": "http://127.0.0.1:8000/v1"}']
