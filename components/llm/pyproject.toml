[project]
name = "anyrsi-llm"
version = "0.4.4"
description = "LLM-backed AnyRSI components: a chat agent for any OpenAI-compatible endpoint (with managed vLLM restarts on weight changes) and a prompt-rewriting proposer"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_llm"]
