[project]
name = "anyrsi-gate"
version = "0.4.2"
description = "Holdout gate with optional significance, anchor and cost checks"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.scripts]
anyrsi-gate = "anyrsi_gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_gate"]
