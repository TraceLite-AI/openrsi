[project]
name = "openrsi-attribution"
version = "0.4.0"
description = "Evidence-based attribution for agent self-improvement"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5"]

[project.scripts]
openrsi-attribution = "openrsi_attribution:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_attribution"]
