[project]
name = "anyrsi-attribution"
version = "0.4.1"
description = "Evidence-based attribution for agent self-improvement"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.scripts]
anyrsi-attribution = "anyrsi_attribution:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_attribution"]
