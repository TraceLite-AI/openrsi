[project]
name = "openrsi-harness"
version = "0.4.0"
description = "A git repository of agent code (the harness) as a versioned evolvable, plus a subprocess agent that runs it"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5"]

[project.scripts]
openrsi-harness = "openrsi_harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_harness"]
