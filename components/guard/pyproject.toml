[project]
name = "openrsi-guard"
version = "0.4.0"
description = "Policy guard that inspects evolvable patches before they apply (code, secrets, tampering)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5"]

[project.scripts]
openrsi-guard = "openrsi_guard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_guard"]
