[project]
name = "openrsi-proposer"
version = "0.4.2"
description = "Memory patch proposers (rule-based lessons and Claude-backed reflection)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5"]

[project.optional-dependencies]
llm = ["anthropic>=2.3"]

[project.scripts]
openrsi-proposer = "openrsi_proposer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_proposer"]
