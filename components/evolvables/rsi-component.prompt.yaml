protocol: openrsi/0.3
name: openrsi/prompt
version: 0.3.0
description: prompt 库。条目是 agent 指令的段落，render() 按顺序拼成完整 prompt。
kinds: [evolvable]
implements:
  - rsi_component_info
  - rsi_evolvable_describe
  - rsi_evolvable_snapshot
  - rsi_evolvable_apply
  - rsi_evolvable_rollback
  - rsi_evolvable_diff
  - rsi_evolvable_export
capabilities: {snapshot_tree: true}
runtime:
  transport: stdio
  command: [openrsi-evolvables, --kind, prompt, --path, ./prompt-store]
evolvable_surfaces: [sections]
