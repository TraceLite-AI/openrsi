[project]
name = "openrsi-evolvables"
version = "0.3.0"
description = "Prompt and skill libraries as versioned evolvables, with a subprocess sandbox for skills"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.3,<0.4"]

[project.scripts]
openrsi-evolvables = "openrsi_evolvables:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_evolvables"]
