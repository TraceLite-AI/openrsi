[project]
name = "anyrsi-evolvables"
version = "0.4.1"
description = "Prompt and skill libraries as versioned evolvables, with a subprocess sandbox for skills"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.scripts]
anyrsi-evolvables = "anyrsi_evolvables:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_evolvables"]
