[project]
name = "anyrsi-lineage"
version = "0.4.0"
description = "Append-only lineage store for snapshots, scores and gate decisions"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.scripts]
anyrsi-lineage = "anyrsi_lineage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_lineage"]
