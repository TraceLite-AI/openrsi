[project]
name = "openrsi-lineage"
version = "0.3.0"
description = "Append-only lineage store for snapshots, scores and gate decisions"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.3,<0.4"]

[project.scripts]
openrsi-lineage = "openrsi_lineage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_lineage"]
