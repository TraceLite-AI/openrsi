protocol: openrsi/0.2
name: openrsi/lineage
version: 0.2.0
description: 记录每个快照的来源、分数和准入决定，被拒绝的候选也留档；JSONL 持久化。
kinds: [lineage]
implements:
  - rsi_component_info
  - rsi_lineage_record
  - rsi_lineage_log
  - rsi_lineage_best
capabilities: {persistence: jsonl}
runtime:
  transport: stdio
  command: [openrsi-lineage]
