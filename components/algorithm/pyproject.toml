[project]
name = "openrsi-algorithm"
version = "0.4.1"
description = "Search strategies (greedy, archive-based open-ended) over snapshot lineages"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.4,<0.5"]

[project.scripts]
openrsi-algorithm = "openrsi_algorithm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_algorithm"]
