[project]
name = "anyrsi-judge"
version = "0.4.0"
description = "Evidence-based rubric judge for agent self-improvement, served over MCP"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.optional-dependencies]
llm = ["anthropic>=2.3"]

[project.scripts]
anyrsi-judge = "anyrsi_judge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_judge"]
