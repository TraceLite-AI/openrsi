[project]
name = "openrsi-judge"
version = "0.3.0"
description = "Evidence-based rubric judge for agent self-improvement, served over MCP"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["openrsi-sdk>=0.3,<0.4"]

[project.optional-dependencies]
llm = ["anthropic>=2.3"]

[project.scripts]
openrsi-judge = "openrsi_judge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi_judge"]
