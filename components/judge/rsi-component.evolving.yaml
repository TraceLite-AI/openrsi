protocol: openrsi/0.4
name: openrsi/evolving-judge
version: 0.4.0
description: 可进化的判别器。rubric 存成带版本的条目，按当前快照打分；修改走补丁、可回滚，由 anchor 集把关。
kinds: [evidence, judge, evolvable]
implements:
  - rsi_component_info
  - rsi_evidence_collect
  - rsi_evidence_verify
  - rsi_judge_evaluate
  - rsi_judge_calibrate
  - rsi_evolvable_describe
  - rsi_evolvable_snapshot
  - rsi_evolvable_apply
  - rsi_evolvable_rollback
  - rsi_evolvable_diff
  - rsi_evolvable_export
capabilities: {self_collect: true, snapshot_tree: true}
runtime:
  transport: stdio
  command: [openrsi-judge, --rubric, rubric.yaml, --evolving, --path, ./rubric-store]
evolvable_surfaces: [rubric]
