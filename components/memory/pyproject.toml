[project]
name = "anyrsi-memory"
version = "0.4.0"
description = "Evolvable memory with versioned snapshots and rollback, served over MCP"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["anyrsi-sdk>=0.4,<0.5"]

[project.scripts]
anyrsi-memory = "anyrsi_memory.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyrsi_memory"]
