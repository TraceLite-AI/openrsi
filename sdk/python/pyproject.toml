[project]
name = "openrsi-sdk"
version = "0.4.2"
description = "OpenRSI protocol types, component base classes, MCP server/client and conformance tests"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7", "pyyaml>=6"]

[project.scripts]
openrsi-conformance = "openrsi.conformance:main"
openrsi-serve = "openrsi.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrsi"]
