name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install cross-language test deps
        run: npm ci --prefix tests/xlang
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python -e runtime \
            -e components/judge -e components/memory -e components/attribution -e components/proposer \
            -e components/algorithm -e components/gate -e components/lineage \
            -e components/evolvables -e components/guard -e components/harness -e components/llm -e components/weights \
            -e adapters/dspy -e adapters/langgraph -e adapters/verl -e adapters/rsihub pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Spec is up to date
        run: |
          python -m openrsi.export_spec spec
          git diff --exit-code spec
      - name: End-to-end example (memory)
        working-directory: examples/secret_ops
        run: |
          openrsi run
          openrsi best
      - name: End-to-end example (skills + guard)
        working-directory: examples/skill_ops
        run: |
          openrsi run
          openrsi log | grep -q "护栏拦截"
      - name: End-to-end example (judge co-evolution)
        working-directory: examples/judge_coevolution
        run: |
          openrsi run
          openrsi best | grep -q '"progress": 3.0'
      - name: End-to-end example (harness evolution + protected paths)
        working-directory: examples/harness_ops
        run: |
          openrsi run
          openrsi log | grep -q "protected_path"
          openrsi best | grep -q '"holdout": 1.0'
      - name: End-to-end example (small model, mock LLM and trainer)
        working-directory: examples/small_model
        run: |
          python make_toy_data.py toy_data
          openrsi run openrsi.mock.yaml
          openrsi best openrsi.mock.yaml | python -c "import json,sys; h=json.load(sys.stdin)['metrics']['holdout']; assert h >= 0.9, h"
      - name: End-to-end example (RSIHub task bank, code + weights, fake Harbor)
        working-directory: examples/rsihub_weights
        run: |
          python make_toy_dataset.py toy_tasks
          openrsi run openrsi.mock.yaml
          openrsi best openrsi.mock.yaml | python -c "import json,sys; h=json.load(sys.stdin)['metrics']['holdout']; assert h >= 0.9, h"
          openrsi-rsihub split toy_tasks --ratios '{"train": 0.5, "gate": 0.25, "sealed": 0.25}' | python -c "import json,sys; assert json.load(sys.stdin)['counts'] == {'train': 30, 'gate': 15, 'sealed': 15}"
      - name: Adapter CLIs
        run: |
          openrsi-verl reward-path
          openrsi-rsihub --help
      - name: Weights CLI
        run: openrsi-weights --help

  trainer:
    # 自带训练器在真实的极小模型上训练（SFT / DPO / KTO / LoRA），需要 CPU 版 torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft
          pip install -e sdk/python -e runtime -e components/judge -e components/memory -e components/attribution \
            -e components/proposer -e components/algorithm -e components/gate -e components/lineage \
            -e components/evolvables -e components/guard -e components/weights pytest
      - name: Trainer tests
        run: pytest -q tests/test_weights_trainer.py
